[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeo-mvp"
version = "0.3.0"
description = "Hashnode Markdown Answer Engine Optimization (AEO) proof of concept — LLM semantics, Python plumbing"

readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AEO MVP" }]
dependencies = [
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]
ui = [
  "gradio>=4.44.0,<6",
]

[project.scripts]
aeo-mvp = "aeo_mvp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "ui/gradio"]
