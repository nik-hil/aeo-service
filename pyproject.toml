[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeo-mvp"
version = "0.1.0"
description = "Backend-only Answer Engine Optimization (AEO) MVP service"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AEO MVP" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.30",
  "httpx>=0.27.0",
  "selectolax>=0.3.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
aeo-mvp = "aeo_mvp.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aeo_mvp = ["demo/fixtures/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uvicorn]
factory = false
