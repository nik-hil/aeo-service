openapi: 3.0.3
info:
  title: AEO MVP API
  description: |
    Backend-only Answer Engine Optimization service.
    Jobs analyze one public site (or demo fixtures) and emit a machine-readable report.
    Visibility experiments are controlled samples (protocol vis-exp-v1 / llm-mention-v1 /
    ai-search-v1), not engine rankings.

    Auth (P0-3): all routes except GET /health require Bearer AEO_API_KEY (fail-closed).
    See docs/security/API_AUTH.md.
  version: 0.1.0

servers:
  - url: http://127.0.0.1:8000
    description: Local MVP

security:
  - bearerAuth: []

tags:
  - name: health
  - name: jobs
  - name: content

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness probe (public — no auth)
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok

  /api/v1/jobs:
    post:
      tags: [jobs]
      summary: Create an analysis job
      operationId: createJob
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
            examples:
              live:
                value:
                  url: https://example.com/
                  demo_mode: false
                  options:
                    max_pages: 25
                    max_depth: 2
                    runs_per_prompt: 3
                    provider: auto
                    category: answer engine optimization
                    content_optimization: true
                    paid_retrieval_opt_in: false
              demo:
                value:
                  url: https://demo.example/
                  demo_mode: true
                  options:
                    provider: demo
              paid_do:
                value:
                  url: https://example.com/
                  options:
                    provider: digitalocean_web_search
                    paid_retrieval_opt_in: true
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCreatedResponse"
        "400":
          description: Invalid URL or options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: Unauthorized

  /api/v1/jobs/{job_id}:
    get:
      tags: [jobs]
      summary: Get job status and score summary
      operationId: getJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatusResponse"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/jobs/{job_id}/report:
    get:
      tags: [jobs]
      summary: Get full machine-readable report
      operationId: getJobReport
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Report (completed jobs)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Job not completed yet, or job failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown job or report missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/jobs/{job_id}/pages:
    get:
      tags: [jobs]
      summary: List crawled pages for a job
      operationId: getJobPages
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Page list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagesResponse"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/content-optimization:
    post:
      tags: [content]
      summary: Grounded content optimization (Phase 5)
      description: |
        page-intel-v1 → content-gap-v1 → opt-brief-v1 → opt-draft-v1
        via aeo_mvp.content. Accepts job_id/page_id, SSRF-safe source_url, or offline html.
        Rejects free-form topic generation. generate_draft/draft_paid default false.
        Authoritative response keys are plurals (content_gaps, optimization_briefs,
        content_drafts). Singular gap_report/brief/draft are deprecated aliases.
      operationId: contentOptimization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentOptimizationRequest"
            examples:
              offline:
                value:
                  html: "<html><body><h1>Demo</h1></body></html>"
                  url: https://demo.example/
                  generate_draft: true
                  draft_paid: false
      responses:
        "200":
          description: Optimization result (authoritative plural keys)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentOptimizationResponse"
        "400":
          description: Validation, SSRF rejection, or missing HTML (non-job)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown job_id or page_id not on job (aligned with /jobs)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Job page present but empty/missing HTML (unless allow_empty_html)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Malformed body (e.g. topic-only generate / extra fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Live source_url fetch failed after SSRF validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: |
        Shared secret from AEO_API_KEY (Authorization: Bearer <key>).
        Fail-closed: missing/blank key → 401 on all protected routes.
        See docs/security/API_AUTH.md.

  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    CreateJobRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Public http(s) base URL (one site per job)
        demo_mode:
          type: boolean
          default: false
        options:
          $ref: "#/components/schemas/JobOptions"

    JobOptions:
      type: object
      description: |
        Job options. Extra keys are preserved (Phase 4 discovery / seeds).
        Aligns with aeo_mvp.api.schemas.JobOptions.
      additionalProperties: true
      properties:
        max_pages:
          type: integer
          minimum: 1
          maximum: 25
          default: 25
        max_depth:
          type: integer
          minimum: 0
          maximum: 2
          default: 2
        runs_per_prompt:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        provider:
          type: string
          enum:
            - auto
            - demo
            - openai_compatible
            - digitalocean_web_search
            - digitalocean
          default: auto
          description: |
            Visibility provider. digitalocean / digitalocean_web_search require
            paid_retrieval_opt_in=true and a ready QuerySet (ADR-026).
        category:
          type: string
          description: Category phrase for prompt-set-v1 templates (fallback path)
        # Phase 4 query intelligence
        selection_seed:
          oneOf:
            - type: integer
            - type: string
          nullable: true
        query_selection_seed:
          oneOf:
            - type: integer
            - type: string
          nullable: true
        experiment_seed:
          oneOf:
            - type: integer
            - type: string
          nullable: true
        query_discovery_version:
          type: string
          enum: [v1, v2, query-discovery-v1, query-discovery-v2]
          default: v2
          nullable: true
        discovery_only:
          type: boolean
          default: false
        dry_run:
          type: boolean
          default: false
          description: Alias for discovery_only (forces paid_retrieval_opt_in false)
        paid_retrieval_opt_in:
          type: boolean
          default: false
          description: Explicit opt-in for paid DigitalOcean web_search (ADR-026)
        query_top_n:
          type: integer
          minimum: 8
          maximum: 30
          nullable: true
        semantic_dedup:
          type: string
          enum: [lexical, simhash, simhash_v1]
          default: lexical
          nullable: true
        mmr_lambda:
          type: number
          nullable: true
        max_per_topic:
          type: integer
          nullable: true
        # Phase 5 content optimization
        content_optimization:
          type: boolean
          default: true
          description: Run Phase 5 page intelligence / gaps / briefs after scoring
        content_draft:
          type: boolean
          default: false
        content_draft_provider:
          type: string
          nullable: true
        generate_draft:
          type: boolean
          default: false
          description: Alias for content_draft
        draft_paid:
          type: boolean
          default: false
          description: Paid LLM draft opt-in (never auto)

    JobCreatedResponse:
      type: object
      required: [id, base_url, status, demo_mode, created_at, links]
      properties:
        id:
          type: string
          format: uuid
        base_url:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
        demo_mode:
          type: boolean
        created_at:
          type: string
          format: date-time
        links:
          type: object
          properties:
            self: { type: string }
            report: { type: string }
            pages: { type: string }

    JobStatus:
      type: string
      enum:
        - pending
        - claimed
        - crawling
        - analyzing
        - scoring
        - experimenting
        - synthesizing
        - completed
        - failed

    JobStatusResponse:
      type: object
      required: [id, base_url, status, demo_mode, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        base_url: { type: string }
        status: { $ref: "#/components/schemas/JobStatus" }
        demo_mode: { type: boolean }
        error_message:
          type: string
          nullable: true
        health_score:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
        health_formula_version:
          type: string
          nullable: true
          example: health-v1
        experiment_protocol_version:
          type: string
          nullable: true
          example: llm-mention-v1
        component_scores:
          type: object
          nullable: true
          additionalProperties:
            type: number
          properties:
            technical: { type: number }
            content: { type: number }
            entity: { type: number }
            structured_data: { type: number }
            answerability: { type: number }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at:
          type: string
          format: date-time
          nullable: true

    ContentOptimizationRequest:
      type: object
      additionalProperties: false
      description: |
        Grounded optimization input — not a free-form topic generator.
        Provide job_id (+ optional page_id), source_url, or html (+ optional url).
      properties:
        job_id: { type: string }
        page_id: { type: string }
        source_url: { type: string, format: uri }
        html: { type: string }
        url: { type: string, format: uri }
        queryset: { type: object }
        site_profile: { type: object }
        config: { type: object }
        content_optimization: { type: boolean, default: true }
        content_draft: { type: boolean, default: false }
        content_draft_provider: { type: string, nullable: true }
        generate_draft: { type: boolean, default: false }
        draft_paid: { type: boolean, default: false }
        paid_llm_opt_in: { type: boolean, default: false, description: "Alias for draft_paid" }
        allow_empty_html:
          type: boolean
          default: false
          description: Opt-in to proceed when job page HTML is empty/missing (P1-8)

    ContentOptimizationResponse:
      type: object
      description: |
        Live wire from ContentOptimizationResult.to_dict / run_from_resolved.
        Authoritative keys are plurals. Singular aliases retained for compat.
      required:
        - page_intelligence
        - content_gaps
        - optimization_briefs
        - content_drafts
      properties:
        page_intelligence: { type: object }
        content_gaps:
          type: array
          items: { type: object }
          description: Authoritative gap report list (content-gap-v1)
        optimization_briefs:
          type: array
          items: { type: object }
          description: Authoritative brief list (opt-brief-v1)
        content_drafts:
          type: array
          items: { type: object }
          description: Authoritative draft list (opt-draft-v1)
        gap_report:
          type: object
          nullable: true
          deprecated: true
          description: "Deprecated alias of content_gaps[0]; prefer content_gaps"
          x-deprecated: true
        brief:
          type: object
          nullable: true
          deprecated: true
          description: "Deprecated alias of optimization_briefs[0]; prefer optimization_briefs"
          x-deprecated: true
        draft:
          type: object
          nullable: true
          deprecated: true
          description: "Deprecated alias of content_drafts[0]; prefer content_drafts"
          x-deprecated: true
        paid_retrieval: { type: boolean, default: false }
        paid_llm: { type: boolean, default: false }

    ScoreValue:
      type: object
      required: [value, provenance]
      properties:
        value: { type: number }
        provenance:
          type: string
          enum: [derived_metric, api_observation, llm_assessment, estimate, synthetic_demo]
        formula_version: { type: string }
        numerator: { type: integer }
        denominator: { type: integer }

    Report:
      type: object
      required:
        - job_id
        - base_url
        - demo_mode
        - status
        - methodology
        - caveats
        - scores
        - experiment
        - findings
        - recommendations
        - pages_crawled
        - emitted_at
      properties:
        job_id: { type: string, format: uuid }
        base_url: { type: string }
        demo_mode: { type: boolean }
        status: { $ref: "#/components/schemas/JobStatus" }
        methodology:
          type: object
          properties:
            health_formula_version: { type: string, example: health-v1 }
            experiment_protocol_version: { type: string, example: llm-mention-v1 }
            prompt_set_id:
              type: string
              description: |
                Demo uses prompt-set-v1. Discovered jobs stamp query_set_version
                from discovery (e.g. query-set-v3), not a frozen discovered-queries-v1.
              example: query-set-v3
            crawl:
              type: object
              properties:
                max_pages: { type: integer }
                max_depth: { type: integer }
                user_agent: { type: string }
            content_optimization_methodology: { type: object }
        caveats:
          type: array
          items: { type: string }
        scores:
          type: object
          properties:
            aeo_health: { $ref: "#/components/schemas/ScoreValue" }
            technical: { $ref: "#/components/schemas/ScoreValue" }
            content: { $ref: "#/components/schemas/ScoreValue" }
            entity: { $ref: "#/components/schemas/ScoreValue" }
            structured_data: { $ref: "#/components/schemas/ScoreValue" }
            answerability: { $ref: "#/components/schemas/ScoreValue" }
        experiment:
          type: object
          properties:
            provider_name: { type: string }
            model_id: { type: string, nullable: true }
            observations_count: { type: integer }
            experiment_kind: { type: string }
            protocol_version: { type: string }
            llm_mention_rate: { $ref: "#/components/schemas/ScoreValue" }
            llm_url_mention_rate: { $ref: "#/components/schemas/ScoreValue" }
            ai_search_mention_rate: { $ref: "#/components/schemas/ScoreValue" }
            ai_search_citation_rate: { $ref: "#/components/schemas/ScoreValue" }
            query_coverage: { $ref: "#/components/schemas/ScoreValue" }
        content_optimization:
          type: object
          description: Phase 5 section when content_optimization ran or was disabled
          properties:
            enabled: { type: boolean }
            status: { type: string }
            methodology: { type: object }
            pages_considered: { type: integer }
            pages_optimized: { type: integer }
            paid_retrieval: { type: boolean }
            paid_llm: { type: boolean }
        # Authoritative Phase 5 plurals on completed reports (when optimization ran)
        page_intelligence: { type: object }
        content_gaps:
          type: array
          items: { type: object }
        optimization_briefs:
          type: array
          items: { type: object }
        content_drafts:
          type: array
          items: { type: object }
        gap_report:
          type: object
          deprecated: true
          description: Deprecated singular alias; prefer content_gaps
        brief:
          type: object
          deprecated: true
          description: Deprecated singular alias; prefer optimization_briefs
        draft:
          type: object
          deprecated: true
          description: Deprecated singular alias; prefer content_drafts
        paid_retrieval: { type: boolean }
        paid_llm: { type: boolean }
        findings:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              category: { type: string }
              title: { type: string }
              summary: { type: string }
              severity: { type: string }
              evidence_ids:
                type: array
                items: { type: string }
        recommendations:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              code: { type: string }
              title: { type: string }
              rationale: { type: string }
              effort: { type: string, enum: [S, M, L] }
              impact: { type: number }
              priority_score: { type: number }
              rank: { type: integer }
              evidence_ids:
                type: array
                items: { type: string }
              finding_ids:
                type: array
                items: { type: string }
        pages_crawled: { type: integer }
        emitted_at: { type: string, format: date-time }

    PagesResponse:
      type: object
      required: [job_id, count, pages]
      properties:
        job_id: { type: string, format: uuid }
        count: { type: integer }
        pages:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              url: { type: string }
              final_url: { type: string, nullable: true }
              depth: { type: integer }
              status_code: { type: integer, nullable: true }
              title: { type: string, nullable: true }
              fetch_error: { type: string, nullable: true }

    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: |
            Human-readable error. Auth failures use detail="Unauthorized".
            Job/report conflicts and SSRF rejections include a reason string.
